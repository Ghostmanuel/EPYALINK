<!doctype html><html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2e7d32"><title>EPYALINK — Do campo ao mercado</title><link rel="manifest" href="/manifest.json"><style>
:root{--g:#2e7d32;--g2:#1b5e20;--bg:#f5f7f4;--card:#fff;--line:#dfe6dd;--txt:#182018;--muted:#657064;--red:#b42318;--gold:#a66b00}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#eaf4e8,#f9fbf8)}.auth-card{width:min(440px,100%);background:white;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 18px 55px #19301818}.logo{display:flex;gap:12px;align-items:center;margin-bottom:20px}.brand-logo{width:48px;height:48px;border-radius:14px;object-fit:cover;display:block}.logo-mark{width:48px;height:48px;border-radius:14px;background:var(--g);color:white;display:grid;place-items:center;font-size:25px}.logo b{font-size:23px}.logo small{display:block;color:var(--muted)}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#eef3eb;border-radius:12px;padding:4px;margin-bottom:16px}.tabs button{border:0;background:transparent;padding:10px;border-radius:9px}.tabs .active{background:white;font-weight:700;box-shadow:0 1px 5px #0001}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #ccd7c9;border-radius:12px;background:white;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px #2e7d3220}.btn{border:0;border-radius:12px;background:var(--g);color:white;padding:12px 15px;font-weight:700}.btn.secondary{background:#edf3ea;color:var(--g2)}.btn.danger{background:#fee9e7;color:var(--red)}.btn.full{width:100%}.notice{padding:12px;border-radius:12px;background:#eef5eb;margin:10px 0}.notice.error{background:#fff0ee;color:var(--red)}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:12px max(14px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;align-items:center}.top .logo{margin:0}.top .brand-logo{width:40px;height:40px;border-radius:12px}.main{max-width:1180px;margin:auto;padding:18px 14px 100px}.screen{display:none}.screen.active{display:block}.hero{background:linear-gradient(135deg,#245f2b,#4d914f);color:white;border-radius:20px;padding:22px;margin-bottom:16px}.hero h1{margin:0 0 7px;font-size:clamp(24px,5vw,38px)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 3px 15px #19301808}.product img{width:100%;height:170px;object-fit:cover;border-radius:14px;background:#edf3ea}.product h3{margin:10px 0 4px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted);font-size:13px}.price{font-weight:800;color:var(--g2)}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef4ea;font-size:12px;margin:3px}.verified{color:var(--g2);font-weight:700}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:7px max(6px,calc((100vw - 900px)/2));padding-bottom:max(7px,env(safe-area-inset-bottom))}.bottom button{border:0;background:transparent;color:#5b665b;font-size:11px;padding:6px 2px;border-radius:10px}.bottom button span{display:block;font-size:20px}.bottom button.active{color:var(--g);background:#eef5eb;font-weight:700}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{flex:1;min-width:150px;padding:11px;border:1px solid var(--line);border-radius:12px}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{font-size:24px;font-weight:800}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#eaf1e7}.admin-nav{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.admin-nav button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:10px;padding:9px}.modal{position:fixed;inset:0;background:#0007;z-index:50;display:grid;place-items:end center}.sheet{background:white;width:min(700px,100%);max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.table-wrap{overflow:auto}.table-wrap table{width:100%;border-collapse:collapse;font-size:13px}.table-wrap th,.table-wrap td{padding:9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}@media(max-width:760px){.top{padding:10px 12px}.main{padding:12px 10px 100px}.grid{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}.product img{height:145px}.hero{padding:18px}.top .logo small{display:none}.bottom{grid-template-columns:repeat(6,1fr)}.bottom button{font-size:9px}.bottom button span{font-size:18px}.desktop-only{display:none!important}}
</style></head><body><div id="auth" class="auth"><div class="auth-card"><div class="logo"><img class="brand-logo" src="/static/images/logo-epyalink.png" alt="EPYALINK"><div><b>EPYALINK</b><small>Do campo ao mercado, conectado.</small></div></div><div class="tabs"><button id="loginTab" class="active" onclick="authMode('login')">Entrar</button><button id="regTab" onclick="authMode('register')">Cadastrar</button></div><div id="authBox"></div><div id="authMsg"></div></div></div><div id="app" class="app hidden"><header class="top"><div class="logo"><img class="brand-logo" src="/static/images/logo-epyalink.png" alt="EPYALINK"><div><b>EPYALINK</b><small>Agro • Mercado • Logística</small></div></div><div class="row"><button class="btn secondary" onclick="show('notifications')">🔔</button><button class="btn secondary" onclick="show('profile')">👤</button><button class="btn danger" onclick="logout()">🚪</button></div></header><main class="main"><section id="home" class="screen active"></section><section id="market" class="screen"></section><section id="orders" class="screen"></section><section id="transport" class="screen"></section><section id="chat" class="screen"></section><section id="profile" class="screen"></section><section id="notifications" class="screen"></section><section id="admin" class="screen"></section></main><nav class="bottom"><button onclick="show('home')"><span>🏠</span>Início</button><button onclick="show('market')"><span>🛒</span>Mercado</button><button onclick="show('orders')"><span>📦</span>Pedidos</button><button onclick="show('transport')"><span>🚚</span>Transporte</button><button onclick="show('chat')"><span>💬</span>Chat</button><button onclick="show('profile')"><span>👤</span>Perfil</button></nav></div><div id="modal" class="modal hidden" onclick="if(event.target.id==='modal')closeModal()"><div class="sheet" id="sheet"></div></div><script>
const $=id=>document.getElementById(id);let S={token:localStorage.getItem('epya_token'),user:null,mode:'login'};
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,opt={}){opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});if(S.token)opt.headers.Authorization='Bearer '+S.token;let r=await fetch(path,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||d.message||'Operação não concluída');return d}
function authMode(m){S.mode=m;$('loginTab').classList.toggle('active',m==='login');$('regTab').classList.toggle('active',m==='register');$('authBox').innerHTML=m==='login'?loginForm():registerForm()}
function loginForm(){return `<div class="field"><label>Telefone</label><input id="phone" inputmode="tel" placeholder="929..." /></div><div class="field"><label>Palavra-passe</label><input id="password" type="password" /></div><button class="btn full" onclick="login()">Entrar</button><p class="muted">A sessão fica guardada neste dispositivo até sair.</p>`}
function registerForm(){return `<div class="field"><label>Nome completo</label><input id="rname"></div><div class="field"><label>Telefone</label><input id="rphone" inputmode="tel"></div><div class="field"><label>Palavra-passe</label><input id="rpass" type="password"></div><div class="field"><label>Tipo de conta</label><select id="rrole"><option value="buyer">Comprador</option><option value="seller">Produtor/Vendedor</option><option value="supplier">Fornecedor de insumos</option><option value="transporter">Transportador</option><option value="transport_company">Transportadora</option></select></div><div class="grid"><div class="field"><label>Província</label><input id="rprov"></div><div class="field"><label>Município</label><input id="rmun"></div></div><div class="field"><label>Empresa (se aplicável)</label><input id="rcompany"></div><div class="field"><label>Fazenda (se aplicável)</label><input id="rfarm"></div><button class="btn full" onclick="register()">Criar conta</button>`}
async function login(){try{let d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({phone:$('phone').value,password:$('password').value})});S.token=d.token;localStorage.setItem('epya_token',S.token);await boot()}catch(e){$('authMsg').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}
async function register(){try{let d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({full_name:$('rname').value,phone:$('rphone').value,password:$('rpass').value,role:$('rrole').value,province:$('rprov').value,municipality:$('rmun').value,company_name:$('rcompany').value,farm_name:$('rfarm').value})});S.token=d.token;localStorage.setItem('epya_token',S.token);await boot()}catch(e){$('authMsg').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}
async function boot(){try{S.user=await api('/api/me');$('auth').classList.add('hidden');$('app').classList.remove('hidden');renderHome();show('home')}catch(e){localStorage.removeItem('epya_token');S.token=null;authMode('login');$('authMsg').innerHTML='<div class="notice error">Sessão expirada. Entre novamente.</div>'}}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.bottom button').forEach((b,i)=>b.classList.toggle('active',['home','market','orders','transport','chat','profile'].indexOf(id)===i));if(id==='home')renderHome();if(id==='market')renderMarket();if(id==='orders')renderOrders();if(id==='transport')renderTransport();if(id==='chat')renderChat();if(id==='profile')renderProfile();if(id==='notifications')renderNotifications();if(id==='admin')renderAdmin()}
function renderHome(){let u=S.user;$('home').innerHTML=`<div class="hero"><h1>Olá, ${esc(u.full_name.split(' ')[0])} 👋</h1><p>Do campo ao mercado: produtos, insumos, transporte e pagamento numa só operação.</p><div class="row"><button class="btn" onclick="show('market')">🛒 Abrir Mercado</button>${u.role==='admin'?'<button class="btn secondary" onclick="show(\'admin\')">⚙️ Administração</button>':''}</div></div><div class="grid"><div class="card"><b>🌾 Produção agrícola</b><p class="muted">Milho, feijão, soja, mandioca, frutas e outros.</p></div><button class="card" style="text-align:left;border:1px solid var(--line)" onclick="show('market');setTimeout(()=>{if($('mt')){$('mt').value='input';loadMarket()}},50)"><b>🌱 Insumos</b><p class="muted">Sementes, fertilizantes, adubos, irrigação e equipamentos.</p></button><div class="card"><b>🚚 Logística</b><p class="muted">Peso + distância + rota para calcular o transporte.</p></div></div>`}
async function renderMarket(){let box=$('market');box.innerHTML=`<div class="row between"><h2>Mercado EPYALINK</h2><button class="btn secondary" onclick="newProduct()">＋ Publicar</button></div><div class="toolbar"><input id="mq" placeholder="Pesquisar produto ou insumo"><select id="mt"><option value="">Todos</option><option value="production">Produção agrícola</option><option value="input">Insumos agrícolas</option></select><button class="btn" onclick="loadMarket()">Pesquisar</button></div><div id="marketGrid" class="grid"></div>`;await loadMarket()}
async function loadMarket(){let q=$('mq')?.value||'',t=$('mt')?.value||'';let rows=await api('/api/products?q='+encodeURIComponent(q)+'&product_type='+encodeURIComponent(t));$('marketGrid').innerHTML=rows.length?rows.map(p=>`<article class="card product"><img src="${esc(p.photo||'/static/placeholder.svg')}" onerror="this.src='/static/placeholder.svg'"><div class="row between"><div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.category)} · ${esc(p.province)} ${p.municipality? '· '+esc(p.municipality):''}</div></div><b class="price">${Number(p.price_kz).toLocaleString('pt-AO')} Kz</b></div><div>${p.seller_photo?`<img class="avatar" src="${esc(p.seller_photo)}">`:''}<b>${esc(p.seller_name)}</b> ${p.seller_verified?'✓':''}</div><p class="muted">${esc(p.description||'')}</p><span class="tag">${esc(p.quantity)} ${esc(p.unit)}</span><span class="tag">${esc(p.weight_kg)} kg/un.</span><button class="btn full" onclick="buy(${p.id})">Comprar / Pedir cotação</button></article>`).join(''):'<div class="notice">Nenhum produto encontrado.</div>'}
function newProduct(){if(!['seller','supplier'].includes(S.user.role)){alert('Apenas produtores/vendedores e fornecedores podem publicar.');return}openModal(`<h3>Publicar no Mercado</h3><div class="field"><label>Nome</label><input id="pn"></div><div class="field"><label>Categoria</label><input id="pc" placeholder="Milho, Sementes, Fertilizantes..."></div><div class="field"><label>Tipo</label><select id="pt"><option value="production">Produção agrícola</option><option value="input">Insumo agrícola</option></select></div><div class="grid"><div class="field"><label>Preço Kz</label><input id="pp" type="number"></div><div class="field"><label>Quantidade</label><input id="pq" type="number"></div></div><div class="grid"><div class="field"><label>Unidade</label><input id="pu" value="kg"></div><div class="field"><label>Peso por unidade (kg)</label><input id="pw" type="number" value="1"></div></div><div class="grid"><div class="field"><label>Província</label><input id="pprov" value="${esc(S.user.province||'')}"></div><div class="field"><label>Município</label><input id="pmun"></div></div><div class="field"><label>Fazenda/origem</label><input id="pfarm" value="${esc(S.user.farm_name||'')}"></div><div class="field"><label>Foto do produto</label><input id="pfile" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="field"><label>Descrição</label><textarea id="pd"></textarea></div><button class="btn full" onclick="createProduct()">Publicar</button>`)}
async function createProduct(){try{let d=await api('/api/products',{method:'POST',body:JSON.stringify({name:$('pn').value,category:$('pc').value,product_type:$('pt').value,price_kz:+$('pp').value,quantity:+$('pq').value,unit:$('pu').value,weight_kg:+$('pw').value,province:$('pprov').value,municipality:$('pmun').value,farm:$('pfarm').value,description:$('pd').value})});let f=$('pfile').files[0];if(f){let fd=new FormData();fd.append('file',f);let r=await fetch('/api/products/'+d.id+'/photo',{method:'POST',headers:{Authorization:'Bearer '+S.token},body:fd});if(!r.ok)throw new Error('Produto criado, mas a fotografia não foi carregada.')}closeModal();renderMarket();alert('Produto publicado com sucesso.')}catch(e){alert(e.message)}}
async function buy(id){let p=(await api('/api/products')).find(x=>x.id===id);if(!p)return;openModal(`<h3>Comprar: ${esc(p.name)}</h3><div class="field"><label>Quantidade (${esc(p.unit)})</label><input id="bq" type="number" min="0.01" max="${p.quantity}" value="1"></div><div class="grid"><div class="field"><label>Província de destino</label><input id="bd" placeholder="Luanda"></div><div class="field"><label>Município</label><input id="bm"></div></div><div class="field"><label>Entrega</label><select id="bt"><option value="epyalink">Transporte EPYALINK</option><option value="seller">Transporte do vendedor</option><option value="pickup">Levantamento pelo comprador</option></select></div><div id="quote" class="notice">Preencha o destino e calcule a cotação.</div><button class="btn secondary full" onclick="quote(${id})">Calcular peso + distância + transporte</button><button class="btn full" style="margin-top:8px" onclick="createOrder(${id})">Confirmar pedido</button>`)}
async function quote(id){try{let d=await api('/api/orders/quote',{method:'POST',body:JSON.stringify({product_id:id,quantity:+$('bq').value,destination_province:$('bd').value,destination_municipality:$('bm').value,transport_mode:$('bt').value})});$('quote').innerHTML=`Peso: <b>${d.weight_kg} kg</b><br>Distância estimada: <b>${d.distance_km} km</b><br>Produto: <b>${d.product_total_kz.toLocaleString('pt-AO')} Kz</b><br>Transporte: <b>${d.transport_fee_kz.toLocaleString('pt-AO')} Kz</b><br>Serviço EPYALINK: <b>${d.service_fee_kz.toLocaleString('pt-AO')} Kz</b><br><strong>Total: ${d.total_kz.toLocaleString('pt-AO')} Kz</strong>`}catch(e){$('quote').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}
async function createOrder(id){try{let d=await api('/api/orders',{method:'POST',body:JSON.stringify({product_id:id,quantity:+$('bq').value,destination_province:$('bd').value,destination_municipality:$('bm').value,transport_mode:$('bt').value})});closeModal();show('orders');alert('Pedido #'+d.order_id+' criado. Total: '+d.total_kz.toLocaleString('pt-AO')+' Kz')}catch(e){alert(e.message)}}
async function renderOrders(){let rows=await api('/api/orders');$('orders').innerHTML='<h2>Pedidos</h2>'+ (rows.length?rows.map(o=>`<article class="card" style="margin-bottom:10px"><div class="row between"><h3>#${o.id} · ${esc(o.product_name)}</h3><span class="tag">${esc(o.status)}</span></div><p class="muted">Comprador: ${esc(o.buyer_name)} · Vendedor: ${esc(o.seller_name)}</p><p>${o.quantity} · ${o.weight_kg} kg · produto ${Number(o.product_total_kz).toLocaleString('pt-AO')} Kz · transporte ${Number(o.transport_fee_kz).toLocaleString('pt-AO')} Kz</p><p><b>Total ${Number(o.total_kz).toLocaleString('pt-AO')} Kz</b> · Pagamento: ${esc(o.payment_status)} · Entrega: ${esc(o.delivery_status)}</p><div class="row">${S.user.id===o.buyer_id&&o.payment_status==='PENDING'?`<button class="btn" onclick="pay(${o.id},${o.total_kz})">💳 Pagar</button>`:''}${S.user.id===o.seller_id&&o.status==='PENDING_SELLER'?`<button class="btn" onclick="review(${o.id},true)">Aceitar</button><button class="btn danger" onclick="review(${o.id},false)">Recusar</button>`:''}<button class="btn secondary" onclick="openChat(${o.id})">💬 Chat</button>${S.user.id===o.delivery_transporter_id&&o.delivery_current_status==='REQUESTED'?`<button class="btn" onclick="deliveryDecision(${o.delivery_id},true)">Aceitar transporte</button><button class="btn danger" onclick="deliveryDecision(${o.delivery_id},false)">Rejeitar transporte</button>`:''}${S.user.id===o.delivery_transporter_id&&o.delivery_current_status==='ACCEPTED'?`<button class="btn" onclick="startDelivery(${o.id})">🚚 Iniciar</button>`:''}${S.user.id===o.delivery_transporter_id&&o.delivery_current_status==='IN_TRANSIT'?`<button class="btn" onclick="confirmDelivery(${o.id})">📍 Confirmar entrega</button>`:''}${o.status==='DELIVERED'?`<button class="btn secondary" onclick="rate(${o.id})">⭐ Avaliar</button>`:''}<button class="btn danger" onclick="dispute(${o.id})">Disputa</button></div></article>`).join(''):'<div class="notice">Ainda não existem pedidos.</div>')}
async function deliveryDecision(did,accepted){try{await api('/api/deliveries/'+did+'/decision',{method:'POST',body:JSON.stringify({accepted})});renderOrders()}catch(e){alert(e.message)}}
async function startDelivery(id){try{await api('/api/orders/'+id+'/delivery/start',{method:'POST'});renderOrders()}catch(e){alert(e.message)}}
async function confirmDelivery(id){let pin=prompt('Informe o PIN de entrega fornecido pelo comprador:');if(!pin)return;try{await api('/api/orders/'+id+'/delivery/confirm',{method:'POST',body:JSON.stringify({pin})});alert('Entrega confirmada.');renderOrders()}catch(e){alert(e.message)}}
async function review(id,a){await api('/api/orders/'+id+'/seller-review',{method:'POST',body:JSON.stringify({accepted:a})});renderOrders()}
async function pay(id,total){openModal(`<h3>Pagamento do pedido #${id}</h3><p>Total: <b>${Number(total).toLocaleString('pt-AO')} Kz</b></p><div class="field"><label>Método</label><select id="pm"><option>Multicaixa Express</option><option>IBAN</option><option>Referência</option></select></div><div class="field"><label>Referência/identificador</label><input id="pref"></div><button class="btn full" onclick="submitPay(${id})">Enviar pagamento para validação</button>`)}
async function submitPay(id){await api('/api/orders/'+id+'/payment',{method:'POST',body:JSON.stringify({method:$('pm').value,reference:$('pref').value})});closeModal();renderOrders()}
async function renderTransport(){let rows=await api('/api/transporters/available');$('transport').innerHTML=`<h2>EPYALINK Logistics</h2><div class="notice">O EPYALINK gere a operação logística; o transporte físico é executado por parceiros verificados.</div><div class="grid">${rows.map(t=>`<div class="card"><div class="row">${t.photo?`<img class="avatar" src="${esc(t.photo)}">`:''}<div><b>${esc(t.full_name)}</b><div class="muted">⭐ ${t.rating||0} · ${t.reviews||0} avaliações</div></div></div><p>${esc(t.vehicle_type||'Veículo')} · ${esc(t.plate)} · ${t.capacity_kg} kg</p><span class="tag">Disponível</span></div>`).join('')||'<div class="notice">Nenhum transportador disponível.</div>'}</div>`}
async function renderChat(){$('chat').innerHTML='<h2>Chat</h2><div class="notice">Abra o chat a partir de um pedido para manter produto, quantidade, preço e identidade associados à conversa.</div>'}
async function openChat(id){let d=await api('/api/orders/'+id+'/chat');openModal(`<div class="row"><img class="avatar" src="${esc(d.other_user.photo||'/static/placeholder.svg')}"><div><h3 style="margin:0">${esc(d.other_user.full_name)}</h3><span class="muted">${esc(d.other_user.role)} · ${d.other_user.verified?'✓ verificado':''} · ⭐ ${d.other_user.rating||0}</span></div></div><hr>${d.messages.map(m=>`<p><b>${m.sender_id===S.user.id?'Você':'Contacto'}:</b> ${esc(m.body)}</p>`).join('')||'<p class="muted">Sem mensagens.</p>'}<div class="field"><textarea id="chatbody" placeholder="Escreva uma mensagem..."></textarea></div><button class="btn full" onclick="sendChat(${id})">Enviar</button>`)}
async function sendChat(id){await api('/api/orders/'+id+'/chat',{method:'POST',body:JSON.stringify({body:$('chatbody').value})});openChat(id)}
async function rate(id){openModal(`<h3>Avaliar</h3><div class="field"><label>Nota 1–5</label><input id="rs" type="number" min="1" max="5" value="5"></div><div class="field"><label>Comentário</label><textarea id="rc"></textarea></div><button class="btn full" onclick="sendRating(${id})">Enviar avaliação</button>`)}
async function sendRating(id){await api('/api/orders/'+id+'/rating',{method:'POST',body:JSON.stringify({score:+$('rs').value,comment:$('rc').value})});closeModal();alert('Avaliação registada.')}
async function dispute(id){openModal(`<h3>Abrir disputa</h3><div class="field"><label>Motivo</label><select id="dr"><option>Produto diferente</option><option>Quantidade incorreta</option><option>Produto danificado</option><option>Entrega não realizada</option><option>Pagamento contestado</option><option>Problema com PIN</option></select></div><div class="field"><label>Evidências/descrição</label><textarea id="de"></textarea></div><button class="btn danger full" onclick="sendDispute(${id})">Abrir disputa</button>`)}
async function sendDispute(id){await api('/api/orders/'+id+'/dispute',{method:'POST',body:JSON.stringify({reason:$('dr').value,evidence:$('de').value})});closeModal();alert('Disputa aberta.')}
async function renderProfile(){let u=await api('/api/me');S.user=u;$('profile').innerHTML=`<div class="card"><div class="row"><img class="avatar" style="width:72px;height:72px" src="${esc(u.photo||'/static/placeholder.svg')}"><div><h2 style="margin:0">${esc(u.full_name)}</h2><div>${esc(u.role)} ${u.verified?'✓ verificado':''}</div><div class="muted">⭐ ${u.rating||0} · ${u.reviews||0} avaliações · ${u.completed_sales||0} vendas · ${u.completed_deliveries||0} entregas</div></div></div><hr><p><b>Local:</b> ${esc(u.province||'')} ${esc(u.municipality||'')}</p><p><b>Empresa:</b> ${esc(u.company_name||'-')}</p><p><b>Fazenda:</b> ${esc(u.farm_name||'-')}</p><div class="field"><label>Alterar foto de perfil</label><input id="pf" type="file" accept="image/*"></div><button class="btn" onclick="uploadProfile()">Atualizar foto</button> <button class="btn danger" onclick="logout()">🚪 Sair</button>${u.role==='admin'?'<button class="btn secondary" onclick="show(\'admin\')">⚙️ Painel administrativo</button>':''}</div>`}
async function uploadProfile(){let f=$('pf').files[0];if(!f)return;let fd=new FormData();fd.append('file',f);let r=await fetch('/api/files/profile-photo',{method:'POST',headers:{Authorization:'Bearer '+S.token},body:fd});if(!r.ok)alert('Não foi possível atualizar a foto.');else{alert('Foto atualizada.');renderProfile()}}
async function renderNotifications(){let r=await api('/api/notifications');$('notifications').innerHTML='<h2>Notificações</h2>'+(r.length?r.map(n=>`<div class="card" style="margin-bottom:8px"><b>${esc(n.title)}</b><p>${esc(n.body)}</p><small class="muted">${esc(n.created_at)}</small></div>`).join(''):'<div class="notice">Sem notificações.</div>')}
async function renderAdmin(){if(S.user.role!=='admin'){show('home');return}let d=await api('/api/admin/dashboard');$('admin').innerHTML=`<h2>Administração EPYALINK</h2><div class="admin-nav"><button onclick="adminSection('dashboard')">Dashboard</button><button onclick="adminSection('payments')">Pagamentos</button><button onclick="adminSection('orders')">Pedidos</button><button onclick="adminSection('users')">Utilizadores</button><button onclick="adminSection('products')">Produtos</button><button onclick="adminSection('reports')">Relatórios</button><button onclick="adminSection('audit')">Auditoria</button><button onclick="adminSection('disputes')">Disputas</button><button onclick="adminSection('settings')">Tarifas</button></div><div id="adminBox"><div class="stat-grid">${Object.entries(d).map(([k,v])=>`<div class="card"><span class="muted">${esc(k)}</span><div class="stat">${Number(v||0).toLocaleString('pt-AO')}</div></div>`).join('')}</div></div>`}
async function adminSection(s){
 let b=$('adminBox');
 try{
  if(s==='dashboard'){renderAdmin();return}
  if(s==='payments'){
   let r=await api('/api/admin/payments');
   b.innerHTML='<h3>Pagamentos</h3>'+r.map(p=>`<div class="card" style="margin-bottom:8px"><b>#${p.id} · Pedido #${p.order_id}</b><p>${esc(p.buyer_name)} → ${esc(p.seller_name)} · ${Number(p.amount_kz).toLocaleString('pt-AO')} Kz · <b>${p.status}</b></p>${p.status==='PENDING'?`<button class="btn" onclick="approvePay(${p.id},true)">Aprovar</button> <button class="btn danger" onclick="approvePay(${p.id},false)">Recusar</button>`:''}${p.status==='PAID'?`<button class="btn secondary" onclick="releaseOrder(${p.order_id})">Liberar liquidação</button>`:''}</div>`).join('')||'<div class="notice">Sem pagamentos.</div>';
  }else if(s==='users'){
   let r=await api('/api/admin/users');
   b.innerHTML='<h3>Utilizadores</h3>'+r.map(x=>`<div class="card" style="margin-bottom:8px"><div class="row">${x.photo?`<img class="avatar" src="${esc(x.photo)}">`:''}<div><b>${esc(x.full_name)}</b><div>${esc(x.role)} · ${esc(x.phone)} · ${esc(x.province||'')}</div><div>⭐ ${x.rating||0} · ${x.reviews||0} ${x.verified?'· ✓ verificado':''}</div></div></div>${!x.verified?`<button class="btn" onclick="verify(${x.id})">Verificar</button>`:''}</div>`).join('');
  }else if(s==='products'){
   let r=await api('/api/admin/products');
   b.innerHTML='<h3>Produtos e insumos</h3>'+r.map(x=>`<div class="card" style="margin-bottom:8px"><div class="row">${x.photo?`<img class="avatar" src="${esc(x.photo)}">`:''}<div><b>${esc(x.name)}</b><div>${esc(x.category)} · ${esc(x.product_type)} · ${x.quantity} ${esc(x.unit)}</div><div>${esc(x.seller_name)}</div></div></div></div>`).join('');
  }else if(s==='orders'){
   let r=await api('/api/admin/orders');
   b.innerHTML='<h3>Pedidos</h3>'+r.map(x=>`<div class="card" style="margin-bottom:8px"><b>#${x.id} ${esc(x.product_name)}</b><p>${esc(x.buyer_name)} → ${esc(x.seller_name)}</p><p>Total ${Number(x.total_kz).toLocaleString('pt-AO')} Kz · ${esc(x.status)} · ${esc(x.payment_status)} · ${esc(x.delivery_status)}</p></div>`).join('');
  }else if(s==='reports'){
   let r=await api('/api/admin/reports');
   b.innerHTML='<h3>Relatórios</h3><div class="stat-grid">'+[['Vendas',r.sales_total_kz],['Transporte',r.transport_total_kz],['Pedidos',r.orders_total],['Entregues',r.delivered_orders],['Utilizadores ativos',r.active_users],['Produtos ativos',r.products_active],['Pagamentos pendentes',r.pending_payments_kz]].map(x=>`<div class="card"><span class="muted">${x[0]}</span><div class="stat">${Number(x[1]||0).toLocaleString('pt-AO')}</div></div>`).join('')+'</div>';
  }else if(s==='audit'){
   let r=await api('/api/admin/audit');
   b.innerHTML='<h3>Auditoria</h3>'+r.items.map(x=>`<div class="card" style="margin-bottom:7px"><b>${esc(x.action)}</b> · ${esc(x.entity||'')} #${esc(x.entity_id||'')}<div class="muted">${esc(x.actor_name||'Sistema')} · ${esc(x.created_at)}</div><pre style="white-space:pre-wrap">${esc(x.details||'')}</pre></div>`).join('');
  }else if(s==='disputes'){
   let r=await api('/api/admin/disputes');
   b.innerHTML='<h3>Disputas</h3>'+r.map(x=>`<div class="card" style="margin-bottom:7px"><b>#${x.id} · Pedido #${x.order_id}</b><p>${esc(x.reason)}</p><div class="muted">${esc(x.status)} · ${esc(x.opened_by_name)}</div></div>`).join('');
  }else if(s==='settings'){
   b.innerHTML='<h3>Tarifas de logística</h3><p class="muted">O administrador pode ajustar a tarifa base, por quilómetro, por kg e a comissão.</p><div class="field"><label>Tarifa base (Kz)</label><input id="setbase" type="number" value="5000"></div><div class="field"><label>Tarifa por km (Kz)</label><input id="setkm" type="number" value="75"></div><div class="field"><label>Tarifa por kg (Kz)</label><input id="setkg" type="number" value="8"></div><div class="field"><label>Comissão</label><input id="setcomm" type="number" step="0.001" value="0.04"></div><button class="btn full" onclick="saveSettings()">Guardar tarifas</button>';
  }
 }catch(e){b.innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}
}
async function approvePay(id,a){await api('/api/admin/payments/'+id+'/approve',{method:'POST',body:JSON.stringify({approved:a})});adminSection('payments')}
async function releaseOrder(id){try{await api('/api/admin/orders/'+id+'/release',{method:'POST'});alert('Liquidação autorizada.');adminSection('payments')}catch(e){alert(e.message)}}
async function saveSettings(){for(const [k,id] of [['transport_base','setbase'],['transport_rate_km','setkm'],['transport_rate_kg','setkg'],['commission_rate','setcomm']]){await api('/api/admin/settings/'+k,{method:'POST',body:JSON.stringify({value:$(id).value})})}alert('Tarifas atualizadas.')}
async function verify(id){await api('/api/admin/users/'+id+'/verify',{method:'POST'});adminSection('users')}
function openModal(html){$('sheet').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}
async function logout(){if(!confirm('Tem certeza de que deseja sair da sua conta?'))return;try{if(S.token)await api('/api/auth/logout',{method:'POST'})}catch(e){}localStorage.removeItem('epya_token');S={token:null,user:null,mode:'login'};$('app').classList.add('hidden');$('auth').classList.remove('hidden');authMode('login')}
authMode('login');if(S.token)boot();
</script></body></html>
