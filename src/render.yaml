services:
  - type: web
    name: epyalink
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      # A base de dados já existe (epyalink-db), por isso não a recriamos aqui.
      # Cola o "Internal Database URL" dela nesta variável, manualmente, no painel do Render.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: KAMBASMS_API_KEY
        sync: false
      - key: KAMBASMS_BASE_URL
        value: https://api.kambasms.ao
      - key: ORS_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE
        value: otp_code
