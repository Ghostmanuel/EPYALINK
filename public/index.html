<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPYALINK — o Alibaba do Agro Angolano</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2F5233">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EPYALINK">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="icon" href="/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEEE2;--surface:#FFFFFF;--surface2:#F7F5EA;--ink:#23281F;--muted:#5B6154;--line:#DEDACB;
  --brand:#2F5233;--brand-ink:#FFFFFF;--brand2:#A8532E;--sun:#D9A441;--sun-soft:#F6E6C4;
  --red:#A8402C;--red-soft:#F3DCD4;--blue:#2C5A82;--blue-soft:#DAE6F0;--ok-soft:#DCE8DA;--dim:rgba(20,24,17,.55);
  --fd:'Fraunces','Georgia',serif;--fb:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--fd);line-height:1.15;margin:0;letter-spacing:-.01em;font-weight:700}
h1{font-size:28px}h2{font-size:21px}h3{font-size:17px;font-family:var(--fb);font-weight:700}h4{font-size:15px;font-family:var(--fb);font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}

#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.authbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px;width:100%;max-width:420px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-size:26px;font-weight:800;color:var(--brand);margin-bottom:6px}
.authbox p.sub{color:var(--muted);margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);width:100%}
.field textarea{resize:vertical;min-height:70px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.roles label{border:1px solid var(--line);border-radius:8px;padding:10px 6px;text-align:center;font-size:13px;font-weight:600;cursor:pointer}
.roles input{display:none}
.roles label:has(input:checked){border-color:var(--brand);background:var(--ok-soft);color:var(--brand)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.sun{background:var(--sun);color:#2E2200;border-color:var(--sun)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.wide{width:100%;padding:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:0;padding:0;color:var(--brand);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.authbox .switch{text-align:center;margin-top:16px;font-size:14px;color:var(--muted)}
.err{color:var(--red);font-weight:600;font-size:14px;min-height:1.3em;margin:4px 0}
.ok{color:var(--brand);font-weight:600;font-size:14px}
.chanrow{display:flex;gap:8px;margin-bottom:14px}
.chanrow label{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px;text-align:center;font-size:13px;font-weight:600;cursor:pointer}
.chanrow input{display:none}
.chanrow label:has(input:checked){border-color:var(--brand);background:var(--ok-soft)}

#app{display:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--brand);color:#fff}
.top .logo{color:#fff;margin:0;margin-right:auto;font-size:22px}
.bell{position:relative;background:none;border:0;color:#fff;padding:6px;border-radius:8px;display:grid;place-items:center}
.bell b{position:absolute;top:0;right:0;min-width:17px;height:17px;border-radius:9px;background:var(--sun);color:#2E2200;font-size:10px;display:grid;place-items:center;padding:0 3px}
.who{font-size:13px;opacity:.9}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1180px;margin:0 auto;min-height:calc(100vh - 54px)}
#nav{padding:20px 10px;display:flex;flex-direction:column;gap:2px;align-self:start;position:sticky;top:54px}
#nav button{display:flex;justify-content:space-between;text-align:left;background:none;border:0;border-left:4px solid transparent;padding:10px 12px;border-radius:0 8px 8px 0;font-weight:500}
#nav button.on{border-left-color:var(--sun);background:var(--surface);font-weight:700;color:var(--brand)}
#nav .n{background:var(--red);color:#fff;border-radius:10px;min-width:19px;padding:0 5px;font-size:11px;text-align:center}
#nav button.logout{color:var(--red);margin-top:16px}
#main{padding:22px 20px 60px;min-width:0}
@media (max-width:820px){.shell{display:block}#nav{position:fixed;left:0;right:0;bottom:0;top:auto;flex-direction:row;overflow-x:auto;padding:6px;background:var(--surface);border-top:1px solid var(--line);z-index:20}#nav button{flex:0 0 auto;border-left:0;border-top:3px solid transparent;border-radius:8px;font-size:13px}#nav button.on{border-top-color:var(--sun)}#nav button.logout{display:none}#main{padding:16px 14px 90px}}

.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph p{color:var(--muted);margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.star{color:var(--sun)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.empty{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--fd);font-size:17px;margin-bottom:4px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.chip.ver{background:var(--ok-soft);color:var(--brand);border-color:transparent}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--brand)}.pill.info{background:var(--blue-soft);color:var(--blue)}
.pill.warn{background:var(--sun-soft);color:var(--ink)}.pill.bad{background:var(--red-soft);color:var(--red)}.pill.muted{background:var(--surface2);color:var(--muted)}
.note{background:var(--surface2);border-left:4px solid var(--brand);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px;margin:12px 0}
.note.warn{border-left-color:var(--sun);background:var(--sun-soft)}
.note.bad{border-left-color:var(--red);background:var(--red-soft)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi span{color:var(--muted);font-size:13px}
.kpi b{display:block;font:800 24px var(--fd);margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--sun)}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:480px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);background:var(--surface2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.sech{margin:26px 0 12px}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips .chip{cursor:pointer;font-size:14px;padding:5px 12px}
.chips .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.filters input,.filters select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}

.tile{aspect-ratio:4/3;background:var(--t,#ddd) center/cover no-repeat;display:grid;place-items:center;font-size:46px;border-radius:8px}
.tile.sm{width:76px;aspect-ratio:1;font-size:30px;flex:0 0 auto}
.tile.big{width:140px;aspect-ratio:1;font-size:56px;flex:0 0 auto}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.pc:hover{border-color:var(--brand)}
.pc-top{position:relative;padding:8px 8px 0}
.pc.out .tile{filter:grayscale(.85);opacity:.7}
.soldout{position:absolute;left:16px;top:16px;background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px}
.heart{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:50%;border:0;background:var(--surface);font-size:17px;color:var(--red);display:grid;place-items:center}
.pc-body{padding:10px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.price{font:800 19px var(--fd)}.price small{font:500 13px var(--fb);color:var(--muted)}
.stock{font-size:13px;font-weight:600;color:var(--brand)}.stock.bad{color:var(--red)}
.loc{font-size:12px;color:var(--muted)}
.seller{margin-top:auto;padding-top:8px;border-top:1px solid var(--line);display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}

.rep{display:flex;gap:12px;align-items:flex-start}
.av{width:48px;height:48px;border-radius:50%;background:var(--brand) center/cover;color:#fff;display:grid;place-items:center;font:700 16px var(--fd);flex:0 0 auto}
.rn{font:700 17px var(--fd)}
.rl{font-weight:600;font-size:13px}.rl.v{color:var(--brand)}
.tick{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--brand);color:#fff;font-size:10px}
.rr,.rs{font-size:13px;color:var(--muted)}

.trail{list-style:none;margin:14px 0;padding:0;display:flex}
.trail li{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;font-weight:600;color:var(--muted);text-align:center}
.trail li::before{content:"";position:absolute;top:8px;left:-50%;width:100%;height:3px;background:var(--line)}
.trail li:first-child::before{display:none}
.trail i{position:relative;z-index:1;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--line);font-style:normal}
.trail li.done{color:var(--ink)}.trail li.done i{background:var(--brand);border-color:var(--brand)}.trail li.done::before,.trail li.cur::before{background:var(--brand)}
.trail li.cur i{border-color:var(--sun);background:var(--sun);box-shadow:0 0 0 3px var(--sun-soft)}

.olist{display:flex;flex-direction:column;gap:14px}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.oc-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.oc-h small{color:var(--muted)}
.hint{font-size:14px;color:var(--muted);margin-bottom:10px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 18px;margin:10px 0}
.kv div{display:flex;flex-direction:column}.kv dt{font-size:12px;color:var(--muted);font-weight:600}.kv dd{margin:0;font-weight:500}
.kv .tot dd{font:800 17px var(--fd)}
.code{display:inline-block;font:700 22px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;background:var(--sun-soft);border:2px dashed var(--sun);border-radius:8px;padding:3px 12px}
.evd{background:var(--surface2);border-radius:8px;padding:12px;margin:12px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
details.log{margin-top:10px;font-size:14px}details.log summary{cursor:pointer;color:var(--muted);font-weight:600}
details.log ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}

#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.ov{position:absolute;inset:0;background:var(--dim)}
.dlg{position:relative;background:var(--surface);border-radius:14px;width:min(680px,100%);max-height:calc(100vh - 30px);overflow:auto;padding:22px}
.dlg .x{position:absolute;right:10px;top:10px;width:34px;height:34px;border:0;background:var(--surface2);border-radius:50%;font-size:20px}
.dlg h2{margin-bottom:8px;padding-right:34px}
.dlg .m{color:var(--muted);margin-bottom:10px}
.sec{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.opts{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.opt{display:flex;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--brand);background:var(--surface2)}
.opt small{color:var(--muted);display:block}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.blk{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
.blk input,.blk select,.blk textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-weight:400;color:var(--ink);width:100%}
.sum{background:var(--surface2);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.sum div{display:flex;justify-content:space-between;padding:2px 0}
.sum .t{font:800 18px var(--fd);border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.sp{display:flex;gap:2px;margin:4px 0 10px}
.sp button{background:none;border:0;font-size:32px;line-height:1;color:var(--line)}
.sp button.on{color:var(--sun)}
.pv img{max-width:100%;max-height:140px;border-radius:8px;margin-top:8px}
.dlg img.full{width:100%;border-radius:8px}

.plist{display:flex;flex-direction:column;gap:10px}
.pr-row{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.pr-i{flex:1;min-width:0}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--brand);font-style:normal}
.bl{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;font-size:14px}
.bl .bar{margin:0}

.fban{height:100px;border-radius:12px 12px 0 0;background:repeating-linear-gradient(100deg,var(--brand) 0 14px,#3B6640 14px 28px)}
.fhero{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:20px}
.fbody{padding:16px}
.fstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.fstats div{background:var(--surface2);border-radius:8px;padding:10px}.fstats b{display:block;font:800 19px var(--fd)}.fstats span{font-size:12px;color:var(--muted)}
.gal{display:flex;gap:8px;flex-wrap:wrap}
.gal button{width:120px;height:90px;border-radius:8px;border:0;background:center/cover}
.rev{border-bottom:1px solid var(--line);padding:10px 0}.rev:last-child{border:0}
.back{background:none;border:0;color:var(--brand);font-weight:600;padding:0 0 12px}

.chat{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;min-height:440px}
.tl{display:flex;flex-direction:column;gap:8px}
.th{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;width:100%}
.th.on{border-color:var(--brand);background:var(--surface2)}
.th b{font-size:14px}.th small{color:var(--muted)}.th .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:6px}
.conv{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:440px}
.ctx{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--sun-soft);border-radius:12px 12px 0 0}
.ctx small{display:block;color:var(--muted)}.ctx b{font:700 16px var(--fd)}
.msgs{flex:1;padding:14px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:380px}
.msg{max-width:80%;padding:8px 12px;border-radius:12px;background:var(--surface2)}
.msg.me{align-self:flex-end;background:var(--brand);color:#fff}
.msg small{display:block;font-size:11px;opacity:.7}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.composer input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 10px}
@media (max-width:820px){.chat{display:block}.chat .tl.hideM,.chat .conv.hideM{display:none}}

#np{position:fixed;inset:0;z-index:40}
.nov{position:absolute;inset:0}
.npp{position:absolute;right:12px;top:60px;width:min(370px,calc(100% - 24px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.npp header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.ni{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px}
.ni.un{background:var(--surface2)}
.ni .g{flex:0 0 26px;height:26px;border-radius:50%;background:var(--ok-soft);color:var(--brand);display:grid;place-items:center;font-size:12px;font-weight:700}
.ni small{color:var(--muted);display:block}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (min-width:821px){#toast{bottom:24px}}
.loading{text-align:center;color:var(--muted);padding:40px}
.imgbtn{border:0;padding:0;background:none;cursor:pointer}
</style>
</head>
<body>

<div id="auth">
  <div class="authbox">
    <div class="logo">🌱 EPYALINK</div>
    <div id="authView"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="logo">🌱 EPYALINK</div>
    <span class="who" id="whoLabel"></span>
    <button class="bell" id="bellBtn" aria-label="Notificações">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
      <b id="bellN" hidden></b>
    </button>
  </header>
  <div class="shell">
    <nav id="nav" aria-label="Principal"></nav>
    <main id="main"></main>
  </div>
</div>

<div id="np" hidden></div>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(Number(n)||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const kz=n=>fmt(n)+' Kz';
const dec=n=>Number(n||0).toFixed(1).replace('.',',');
const H=3600e3,D=24*H;
const MONTHS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const UNIT1={kg:'kg',toneladas:'tonelada',sacos:'saco',unidades:'unidade'};
const qtyTxt=(q,u)=>fmt(q)+' '+(Number(q)===1?(UNIT1[u]||u):u);

function km(a,b){if(a===b)return 30;const A=PROV_LL[a],B=PROV_LL[b];if(!A||!B)return 50;const r=x=>x*Math.PI/180;const h=Math.sin(r(B[0]-A[0])/2)**2+Math.cos(r(A[0]))*Math.cos(r(B[0]))*Math.sin(r(B[1]-A[1])/2)**2;return Math.round(2*6371*Math.asin(Math.sqrt(h))*1.3/10)*10;}
function feeFor(unit,qty,from,to){const w=qty*(KG[unit]||1);return Math.round((4000+km(from,to)*(25+Math.min(w,20000)*.02))/100)*100;}

/* ---------- API ---------- */
let TOKEN=localStorage.getItem('al_token')||null;
async function api(path,opts={}){
  const headers={'Content-Type':'application/json',...(opts.headers||{})};
  if(TOKEN)headers.Authorization='Bearer '+TOKEN;
  let res;
  try{res=await fetch('/api'+path,{...opts,headers});}
  catch{throw new Error('Sem ligação ao servidor. Tenta novamente.');}
  let data=null;
  try{data=await res.json();}catch{}
  if(!res.ok)throw new Error((data&&data.error)||('Ocorreu um erro ('+res.status+').'));
  return data;
}
function setToken(t){TOKEN=t;if(t)localStorage.setItem('al_token',t);else localStorage.removeItem('al_token');}
function readImage(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.75));};im.onerror=()=>toast('Não foi possível ler a imagem.');im.src=r.result;};r.readAsDataURL(file);}

/* ---------- boot ---------- */
async function boot(){
 if(!TOKEN){$('#auth').style.display='grid';$('#app').style.display='none';authView('login');return;}
 try{const r=await api('/auth/me');S.me=r.user;}
 catch{setToken(null);$('#auth').style.display='grid';$('#app').style.display='none';authView('login');return;}
 $('#auth').style.display='none';$('#app').style.display='block';
 $('#whoLabel').textContent=S.me.name+' · '+({BUYER:'Comprador',SELLER:'Produtor',CARRIER:'Transportadora',AGENT:'Ponto EPYALINK',ADMIN:'Administrador'}[S.me.role]);
 S.view=HOME[S.me.role];S.sub={};
 renderNav();await renderMain();await refreshBell();
 clearInterval(boot.poll);boot.poll=setInterval(refreshBell,20000);
}
function logout(){setToken(null);clearInterval(boot.poll);location.reload();}

function trailHtml(status){
 const map={PENDING_PAYMENT:0,PAID:1,ACCEPTED:1,CARRIER_OK:1,IN_TRANSIT:1,DELIVERED:2,CONFIRMED:3,RATED:4};
 const cur=map[status];if(cur==null)return '';
 const labs=['Pagamento','Transporte','Entrega','Confirmação','Avaliação'];
 return `<ol class="trail">${labs.map((l,i)=>`<li class="${i<cur?'done':i===cur?'cur':''}"><i></i><span>${l}</span></li>`).join('')}</ol>`;
}
function hintFor(o){
 const h={PENDING_PAYMENT:'Paga para o vendedor poder preparar a encomenda.',PAID:'Valor em custódia (escrow) no EPYALINK. A aguardar que o vendedor aceite.',
 ACCEPTED:o.mode==='AGROLINK'?'A aguardar que uma transportadora interprovincial aceite o transporte.':o.mode==='ESTAFETA'?'A aguardar que um estafeta urbano aceite a entrega.':o.mode==='VENDEDOR'?'O vendedor está a preparar a entrega.':'Pronta para recolha. O comprador dá o PIN a quem entregar.',
 CARRIER_OK:`Transportador atribuído: ${o.driverName} · ${o.vehiclePlate}. Ainda não partiu.`,
 IN_TRANSIT:o.near?'Fase final do percurso: o PIN já foi enviado ao comprador.':'A mercadoria está a caminho — rastreamento GPS ativo.',
 DELIVERED:'Entrega registada.',CONFIRMED:'Entrega validada por PIN · custódia libertada. Falta avaliar a operação.',RATED:'Operação concluída.',
 DISPUTED:'Disputa aberta. O pagamento fica retido até o administrador decidir.',REFUNDED:'O administrador decidiu reembolsar o comprador. Estoque devolvido.',CANCELLED:'Pedido cancelado. O estoque foi devolvido.'};
 return h[o.status]||'';
}
function segBadge(o){return o.segment==='RETALHO'?`<span class="chip">🏍️ Retalho urbano${o.destZone?' · '+esc(o.destZone):''}</span>`:`<span class="chip">🚚 B2B interprovincial</span>`;}
function orderCard(o,role){
 const [lab,tone]=STATUS_LBL[o.status]||['',''];
 const R=(k,v,c)=>`<div class="${c||''}"><dt>${k}</dt><dd>${v}</dd></div>`;
 const qtyLabel=o.segment==='RETALHO'?fmt(o.retailKg)+' kg':qtyTxt(o.qty,o.product.unit);
 let rows=R('Produto',`${EMO[o.product.category]||'🌿'} ${esc(o.product.name)} · ${qtyLabel}`);
 rows+=role==='buyer'?R('Vendedor',`<button class="lnk" data-openfarm="${o.farm.id}">${esc(o.farm.name)}</button> ${verChip(o.farm.verified)}`):R('Comprador',`${esc(o.buyerName)}${o.buyerCompany?' · '+esc(o.buyerCompany):''} <span><b class="star">★</b> ${dec(o.buyerRating)} <i class="muted">(${o.buyerRatingCount||0})</i></span>`);
 rows+=R('Entrega',MODE_LBL[o.mode]);
 rows+=R('Origem → Destino → Distância',o.mode==='RECOLHA'?`${esc(o.farm.municipality)}, ${esc(o.farm.province)} (recolha no local)`:`${esc(o.farm.province)} → ${esc(o.destProvince)}${o.destZone?' ('+esc(o.destZone)+')':''} → ~${o.distanceKm} km`);
 if(o.pointName)rows+=R('Ponto EPYALINK de recolha',`${esc(o.pointName)} ${o.pickupValidatedAt?'<span class="pill ok">Validado</span>':'<span class="pill warn">Por validar</span>'}`);
 if(o.driverName&&role!=='carrier')rows+=R('Transportador',`${esc(o.driverName)} · ${esc(o.vehiclePlate)}${o.carrierName?' · '+esc(o.carrierName):''} <span class="tick" aria-hidden="true">✓</span>`);
 if(role==='buyer'){rows+=R('Produto',kz(o.goodsTotal));rows+=R('Transporte',(o.mode==='AGROLINK'||o.mode==='ESTAFETA')?kz(o.feeTotal):(o.mode==='VENDEDOR'?'Combinado com o vendedor':'Sem custo'));if(o.platformFee>0)rows+=R('Taxa de plataforma (B2B)',kz(o.platformFee));rows+=R('Total',kz(Number(o.goodsTotal)+Number(o.feeTotal)+Number(o.platformFee||0)),'tot');}
 if(role==='seller'){rows+=R('Valor da venda',kz(o.goodsTotal));rows+=R('Custódia & PIN SMS (~1,5%)','descontada na libertação');rows+=R('A receber (aprox.)',kz(Math.round(o.goodsTotal*0.985)),'tot');}
 if(role==='carrier'){rows+=R('Valor do transporte',kz(o.feeTotal));const rate=o.mode==='ESTAFETA'?0.10:0.08;rows+=R('Comissão EPYALINK',`${Math.round(rate*100)}%`);rows+=R('A receber',kz(Math.round(o.feeTotal*(1-rate))),'tot');}
 const showPinBox=role==='buyer'&&['ACCEPTED','CARRIER_OK','IN_TRANSIT'].includes(o.status);
 const pinBox=showPinBox?`<div class="note warn"><b>PIN de entrega:</b> ${o.pin?`<span class="code">${esc(o.pin)}</span>`:(o.pinSent?'já enviado por SMS ao teu telemóvel.':'será enviado por SMS quando a entrega estiver na fase final.')}<br>Diz o PIN apenas a quem te entregar a mercadoria — o pagamento só é libertado com o PIN correto.${o.pinLocked?'<br><b>PIN bloqueado</b> por demasiadas tentativas erradas.':''} <button class="lnk" data-oact="resendpin:${o.id}" style="margin-top:4px">Reenviar PIN por SMS</button></div>`:'';
 const ev=o.evidence?`<div class="evd"><h4>Evidências da entrega</h4><dl class="kv"><div><dt>Foto</dt><dd>${o.evidence.photo?`<button class="thumb imgbtn" data-imgview="${esc(o.evidence.photo)}" style="width:80px;height:60px;border-radius:6px;background:url('${o.evidence.photo}') center/cover;border:1px solid var(--line)"></button>`:'Sem foto'}</dd></div><div><dt>Data/hora</dt><dd>${stamp(o.evidence.at)}</dd></div><div><dt>Local aproximado</dt><dd>${esc(o.evidence.place)}</dd></div><div><dt>Entregue por</dt><dd>${esc(o.evidence.who)}</dd></div></dl></div>`:'';
 const trackBtn=['CARRIER_OK','IN_TRANSIT','CONFIRMED','RATED'].includes(o.status)&&o.mode!=='RECOLHA'?`<button class="btn" data-track="${o.id}">📍 Ver rastreamento GPS</button>`:'';
 return `<article class="oc" id="ord-${o.id}"><div class="oc-h"><div><h3>${EMO[o.product.category]||'🌿'} ${esc(o.product.name)} · ${qtyLabel}</h3><small>Pedido #${o.id.slice(0,8)} · ${when(o.createdAt)} · ${segBadge(o)}</small></div><span class="pill ${tone}">${lab}</span></div>${trailHtml(o.status)}<p class="hint">${hintFor(o)}</p>${pinBox}<dl class="kv">${rows}</dl>${ev}<div class="acts">${orderActions(o,role)}${trackBtn}</div><details class="log"><summary>Histórico (${o.logs.length})</summary><ul>${o.logs.map(l=>`<li>${stamp(l.at)} — ${esc(l.message)}</li>`).join('')}</ul></details></article>`;
}
function orderActions(o,role){
 const B=(a,t,c)=>`<button class="btn ${c||''}" data-oact="${a}:${o.id}">${t}</button>`;let h='';const st=o.status;
 if(role==='buyer'){
  if(st==='PENDING_PAYMENT')h+=B('pay','Pagar agora','primary')+B('cancel','Cancelar pedido','danger');
  if(st==='CONFIRMED')h+=B('rate','Avaliar vendedor','sun');
  h+=B('chat','Mensagens sobre o pedido');
  if(['PAID','ACCEPTED','CARRIER_OK','IN_TRANSIT','DELIVERED','CONFIRMED','RATED'].includes(st))h+=B('dispute','Problemas com o pedido?');
 }
 if(role==='seller'){
  if(st==='PAID')h+=B('accept','Aceitar pedido','primary');
  if(st==='ACCEPTED'&&o.mode==='VENDEDOR')h+=B('start','Iniciar entrega','primary');
  if(st==='ACCEPTED'&&o.mode==='RECOLHA')h+=B('deliver','Confirmar entrega com PIN','primary');
  if(st==='IN_TRANSIT'&&o.mode==='VENDEDOR')h+=(o.near?'':B('near','Estou perto do destino'))+B('checkpoint','Registar passagem em Hub')+B('deliver','Confirmar entrega com PIN','primary');
  if(['CONFIRMED','RATED'].includes(st)&&!o.ratedBuyer)h+=B('rateBuyer','Avaliar comprador','sun');
  h+=B('chat','Mensagens sobre o pedido');
 }
 if(role==='carrier'){
  if(o.carrierId==null&&st==='ACCEPTED')h+=B('carrierAccept','Aceitar transporte','primary');
  if(st==='CARRIER_OK')h+=B('start','Iniciar transporte','primary');
  if(st==='IN_TRANSIT')h+=(o.near?'':B('near','Estou perto do destino'))+B('checkpoint','Registar passagem em Hub')+B('gps','📡 Partilhar localização')+B('deliver','Confirmar entrega com PIN','primary');
 }
 if(role==='agent'&&!o.pickupValidatedAt&&['ACCEPTED','CARRIER_OK','IN_TRANSIT'].includes(st))h+=B('validatepickup','Validar recolha','primary');
 return h;
}

/* ================= GPS: partilha de localização em viagem ================= */
async function toggleGps(orderId){
 if(S.gps.id===orderId){navigator.geolocation.clearWatch(S.gps.watchId);clearInterval(S.gps.flushTimer);await flushGps(orderId,true);S.gps={};toast('Partilha de localização terminada.');return;}
 if(S.gps.id)await toggleGps(S.gps.id);
 if(!navigator.geolocation)return toast('Este dispositivo não suporta GPS no navegador.');
 S.gps={id:orderId,buf:[]};
 S.gps.watchId=navigator.geolocation.watchPosition(
  pos=>S.gps.buf.push({lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy,at:new Date(pos.timestamp).toISOString()}),
  err=>toast('Erro de GPS: '+err.message),
  {enableHighAccuracy:true,maximumAge:5000,timeout:15000}
 );
 S.gps.flushTimer=setInterval(()=>flushGps(orderId,false),15000);
 toast('A partilhar a tua localização em tempo real.');
}
async function flushGps(orderId,isFinal){
 const pts=S.gps.buf||[];if(!pts.length){if(isFinal)return;return;}
 S.gps.buf=[];
 try{const r=await api('/orders/'+orderId+'/location',{method:'POST',body:JSON.stringify({points:pts})});if(r.near&&!isFinal)toast('Chegaste perto do destino — PIN enviado ao comprador.');}
 catch(x){/* falha silenciosa: tenta novamente no próximo ciclo */}
}

async function buySummary(p){
 const b=S.buy;
 if(b.segment==='RETALHO'){
  const valid=b.retailKg>=1&&b.retailKg<=RETAIL_MAX_KG;
  if(!valid)return `<p class="err">Escolhe entre 1 e ${RETAIL_MAX_KG} kg.</p>`;
  const goods=Math.round(b.retailKg*p.retailPriceKg);
  return `<p class="hint">📍 Entrega em ${esc(b.destZone)}, ${esc(b.dest)} — micro-hub urbano local, por estafeta.</p><div class="sum"><div><span>${b.retailKg} kg × ${kz(p.retailPriceKg)}</span><span>${kz(goods)}</span></div><div><span>Entrega (estafeta)</span><span>calculada pela distância</span></div><div class="t"><span>Total estimado</span><span>${kz(goods)} + entrega</span></div></div><p class="hint">Pagamento em custódia; o valor só é libertado com o PIN de entrega enviado por SMS.</p>`;
 }

 if(!valid)return `<p class="err">Escolhe uma quantidade entre 1 e ${fmt(p.qty)} ${p.unit}.</p>`;
 if(!minOk)return `<p class="err">Pedido mínimo B2B deste produto: ${fmt(p.minOrder)} ${p.unit}.</p>`;
 const route=mode==='RECOLHA'?`📍 Recolha em ${esc(p.farm.municipality)}, ${esc(p.farm.province)}.`:`📍 ${esc(p.farm.province)} → ${esc(dest)} → ~${km(p.farm.province,dest)} km`;
 return `<p class="hint">${route}</p><div class="sum"><div><span>${fmt(qty)} × ${kz(p.price)}</span><span>${kz(goods)}</span></div><div><span>Transporte</span><span>${mode==='AGROLINK'?kz(fee):(mode==='VENDEDOR'?'combinado com o vendedor':'sem custo')}</span></div><div><span>Taxa de plataforma B2B (3%)</span><span>${kz(platformFee)}</span></div><div class="t"><span>Total</span><span>${kz(goods+fee+platformFee)}</span></div></div><p class="hint">O pagamento fica em custódia no EPYALINK até a entrega ser validada por PIN.</p>`;
}

 },
 newProd:()=>`<h2>Novo produto</h2><label class="blk">Nome<input id="np-name" placeholder="Ex.: Milho branco"></label><div class="fg2"><label class="blk">Categoria<select id="np-cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label><label class="blk">Unidade<select id="np-unit">${UNITS.map(c=>`<option>${c}</option>`).join('')}</select></label></div><div class="fg2"><label class="blk">Quantidade<input id="np-qty" type="number" min="1"></label><label class="blk">Preço B2B por unidade (Kz)<input id="np-price" type="number" min="1"></label></div><label class="blk">Lote mínimo B2B (opcional, na mesma unidade)<input id="np-min" type="number" min="0" value="0"></label>
 <label class="opt" style="margin-bottom:12px"><input type="checkbox" id="np-retail"><span><b>Vender também a retalho urbano</b><small>Fracionado em kg, com entrega porta a porta (só para kg, sacos ou toneladas).</small></span></label>
 <div id="np-retailprice" hidden class="blk">Preço a retalho por kg (Kz)<input id="np-priceretail" type="number" min="1"></div>
 <label class="blk">Foto (opcional)<input type="file" accept="image/*" data-filenewprod></label><div class="pv" id="pv-newprod"></div><p class="err" id="derr"></p><button class="btn primary wide" id="doNewProdBtn">Publicar produto</button>`,
 editProd:async m=>{const p=await api('/products/'+m.id);return `<h2>Editar ${esc(p.name)}</h2><div class="fg2"><label class="blk">Estoque (${p.unit})<input id="ep-qty" type="number" min="0" value="${p.qty}"></label><label class="blk">Preço B2B por ${UNIT1[p.unit]||p.unit} (Kz)<input id="ep-price" type="number" min="1" value="${p.price}"></label></div><label class="blk">Lote mínimo B2B<input id="ep-min" type="number" min="0" value="${p.minOrder||0}"></label><label class="opt" style="margin-bottom:12px"><input type="checkbox" id="ep-retail" ${p.retailEnabled?'checked':''}><span><b>Vender a retalho urbano</b></span></label><div class="blk">Preço a retalho por kg (Kz)<input id="ep-priceretail" type="number" min="1" value="${p.retailPriceKg||''}"></div><p class="err" id="derr"></p><button class="btn primary wide" id="doEditProdBtn" data-id="${p.id}">Guardar alterações</button>`;},
 editAbout:async()=>{const f=await api('/farms/me/mine');return `<h2>Editar fazenda</h2><label class="blk">Nome<input id="ea-name" value="${esc(f.name)}"></label><label class="blk">Descrição<textarea id="ea-about" rows="4">${esc(f.about||'')}</textarea></label><button class="btn primary wide" id="doEditAboutBtn">Guardar</button>`;},
 withdraw:async()=>`<h2>Pedir levantamento</h2><p class="m">Vais receber um código de confirmação por SMS.</p><label class="blk">Valor a levantar (Kz)<input id="wd-amount" type="number" min="5000"></label><p class="err" id="derr"></p><button class="btn primary wide" id="doWithdrawBtn">Pedir código</button>`,
 withdrawConfirm:m=>`<h2>Confirmar levantamento</h2><p class="m">Introduz o código de 6 dígitos recebido por SMS.</p>${m.devCode?`<p class="ok">Modo de teste: código ${esc(m.devCode)}</p>`:''}<label class="blk">Código<input id="wdc-code" inputmode="numeric" maxlength="6"></label><p class="err" id="derr"></p><button class="btn primary wide" id="doWithdrawConfirmBtn" data-id="${m.withdrawalId}">Confirmar</button>`,
 img:m=>`<h2>${esc(m.title||'Evidência')}</h2><img class="full" alt="${esc(m.title||'')}" src="${m.src}">`
};
function closeModal(silent){S.modal=null;const box=$('#modal');box.hidden=true;box.innerHTML='';if(!silent)renderMain();}
async function openModal(m){S.modal=m;const box=$('#modal');box.hidden=false;box.innerHTML='<div class="ov" data-closemodal></div><div class="dlg"><div class="loading">A carregar…</div></div>';
 try{const html=await MOD[m.type](m);if(S.modal===m)box.innerHTML=`<div class="ov" data-closemodal></div><div class="dlg" role="dialog" aria-modal="true">${'<button class="x" data-closemodal>×</button>'}${html}</div>`;}
 catch(x){if(S.modal===m)box.innerHTML=`<div class="ov" data-closemodal></div><div class="dlg"><button class="x" data-closemodal>×</button>${empty('Não foi possível carregar',x.message)}</div>`;}
}
document.addEventListener('click',e=>{if(e.target.closest('[data-closemodal]'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)closeModal();});
document.addEventListener('click',e=>{
 if(e.target.id==='segB2B'||e.target.id==='segRetail'){
  S.buy.segment=e.target.id==='segB2B'?'B2B':'RETALHO';
  $('#segB2B').classList.toggle('on',S.buy.segment==='B2B');$('#segRetail').classList.toggle('on',S.buy.segment==='RETALHO');
  $('#b2bopts').hidden=S.buy.segment!=='B2B';$('#b2bfields').hidden=S.buy.segment!=='B2B';
  $('#retailfields').hidden=S.buy.segment!=='RETALHO';$('#retailzone').hidden=S.buy.segment!=='RETALHO';
  updateBuySum();
 }
});
document.addEventListener('change',e=>{if(e.target.closest('#buyform'))updateBuySum();});
document.addEventListener('input',e=>{if(e.target.closest('#buyform'))updateBuySum();});
async function updateBuySum(){
 if(S.buy.segment==='RETALHO'){S.buy.retailKg=parseInt($('#rkg').value)||0;S.buy.dest=$('#rprov').value;S.buy.destZone=$('#rzone').value;}
 else{const bm=$('input[name=bm]:checked');if(bm)S.buy.mode=bm.value;S.buy.qty=parseFloat($('#bq').value)||0;S.buy.dest=$('#bd').value;}
 const p=await api('/products/'+S.modal.id);const el=$('#buysum');if(el)el.innerHTML=await buySummary(p);
}
document.addEventListener('click',async e=>{
 if(e.target.id==='askSeller'){const p=await api('/products/'+S.modal.id);const r=await api('/threads',{method:'POST',body:JSON.stringify({productId:p.id})});S.threadId=r.id;closeModal(true);go('chat');}
 if(e.target.id==='orderBtn'){
  const b=S.buy,body=b.segment==='RETALHO'?{productId:S.modal.id,segment:'RETALHO',retailKg:b.retailKg,destProvince:b.dest,destZone:b.destZone}:{productId:S.modal.id,segment:'B2B',qty:b.qty,mode:b.mode,destProvince:b.dest};
  try{await api('/orders',{method:'POST',body:JSON.stringify(body)});closeModal(true);S.sub.orders='list';go('orders');toast('Pedido criado. Falta pagar.');}
  catch(x){toast(x.message);}
 }
 if(e.target.id==='doPayBtn'){const pm=$('input[name=pm]:checked');try{await api('/orders/'+S.modal.id+'/pay',{method:'POST',body:JSON.stringify({payMethod:pm?pm.value:'Multicaixa Express'})});closeModal();toast('Pagamento confirmado. Valor em custódia.');}catch(x){toast(x.message);}}
 if(e.target.id==='doAcceptBtn'){const id=e.target.dataset.id,sel=$('#apoint');try{await api('/orders/'+id+'/accept',{method:'POST',body:JSON.stringify({pointId:sel?sel.value||undefined:undefined})});closeModal();toast('Pedido aceite.');}catch(x){toast(x.message);}}
 if(e.target.id==='doDeliverBtn'){const pin=$('#dcode').value;try{await api('/orders/'+S.modal.id+'/deliver',{method:'POST',body:JSON.stringify({pin,photoUrl:TMP.deliver||null})});TMP.deliver=null;closeModal();toast('Entrega validada. Custódia libertada.');}catch(x){$('#derr').textContent=x.message;}}
 if(e.target.id==='doCheckpointBtn'){const id=e.target.dataset.id,hubId=$('#hubsel').value;try{await api('/orders/'+id+'/checkpoint',{method:'POST',body:JSON.stringify({hubId})});closeModal();toast('Passagem registada.');}catch(x){toast(x.message);}}
 if(e.target.id==='doRateBtn'){if(!S.rate.seller)return toast('Escolhe uma nota para o vendedor.');try{await api('/orders/'+S.modal.id+'/rate',{method:'POST',body:JSON.stringify({sellerStars:S.rate.seller,sellerText:$('#rt-seller')?.value||'',carrierStars:S.rate.carrier||undefined,carrierText:$('#rt-carrier')?.value||''})});closeModal();toast('Obrigado pela avaliação.');}catch(x){toast(x.message);}}
 if(e.target.id==='doRateBuyerBtn'){if(!S.rate.buyer)return toast('Escolhe uma nota.');try{await api('/orders/'+S.modal.id+'/rate-buyer',{method:'POST',body:JSON.stringify({stars:S.rate.buyer,text:$('#rt-buyer').value})});closeModal();toast('Comprador avaliado.');}catch(x){toast(x.message);}}
 if(e.target.id==='doDisputeBtn'){const id=e.target.dataset.id,type=$('#dtype').value,text=$('#dtext').value;if(text.trim().length<10){$('#derr').textContent='Descreve o problema com pelo menos 10 caracteres.';return;}try{await api('/orders/'+id+'/dispute',{method:'POST',body:JSON.stringify({type,text,photoUrl:TMP.dispute||null})});TMP.dispute=null;closeModal(true);S.sub.orders='disputes';go('orders');toast('Disputa registada.');}catch(x){$('#derr').textContent=x.message;}}
 if(e.target.id==='doCarrierAcceptBtn'){const d=$('#cdr').value,v=$('#cve').value;try{await api('/orders/'+S.modal.id+'/carrier-accept',{method:'POST',body:JSON.stringify({driverId:d,vehicleId:v})});closeModal(true);S.sub.jobs='mine';go('jobs');toast('Transporte aceite.');}catch(x){toast(x.message);}}
 if(e.target.id==='doNewProdBtn'){const name=$('#np-name').value.trim(),cat=$('#np-cat').value,unit=$('#np-unit').value,qty=+$('#np-qty').value,price=+$('#np-price').value,minOrder=+$('#np-min').value||0,retailEnabled=$('#np-retail').checked,retailPriceKg=retailEnabled?+$('#np-priceretail').value:undefined;
  if(!name||!(qty>0)||!(price>0)){$('#derr').textContent='Preenche nome, quantidade e preço.';return;}
  try{await api('/products',{method:'POST',body:JSON.stringify({name,category:cat,unit,qty,price,minOrder,retailEnabled,retailPriceKg,photoUrl:TMP.newprod||null})});TMP.newprod=null;closeModal();toast('Produto publicado.');}catch(x){$('#derr').textContent=x.message;}}
 if(e.target.id==='doEditProdBtn'){const id=e.target.dataset.id,qty=+$('#ep-qty').value,price=+$('#ep-price').value,minOrder=+$('#ep-min').value||0,retailEnabled=$('#ep-retail').checked,retailPriceKg=$('#ep-priceretail').value?+$('#ep-priceretail').value:undefined;try{await api('/products/'+id,{method:'PUT',body:JSON.stringify({qty,price,minOrder,retailEnabled,retailPriceKg})});closeModal();toast('Produto atualizado.');}catch(x){$('#derr').textContent=x.message;}}
 if(e.target.id==='doEditAboutBtn'){try{await api('/farms/me/mine',{method:'PUT',body:JSON.stringify({name:$('#ea-name').value,about:$('#ea-about').value})});closeModal();toast('Fazenda atualizada.');}catch(x){toast(x.message);}}
 if(e.target.id==='doWithdrawBtn'){const amount=+$('#wd-amount').value;try{const r=await api('/wallet/withdraw',{method:'POST',body:JSON.stringify({amount})});openModal({type:'withdrawConfirm',withdrawalId:r.withdrawalId,devCode:r.devCode});}catch(x){$('#derr').textContent=x.message;}}
 if(e.target.id==='doWithdrawConfirmBtn'){const id=e.target.dataset.id,code=$('#wdc-code').value;try{await api('/wallet/withdraw/'+id+'/confirm',{method:'POST',body:JSON.stringify({code})});closeModal();toast('Levantamento confirmado.');}catch(x){$('#derr').textContent=x.message;}}
});
document.addEventListener('change',e=>{if(e.target.id==='np-retail')$('#np-retailprice').hidden=!e.target.checked;});
document.addEventListener('change',e=>{
 const t=e.target;if(t.type!=='file'||!t.files[0])return;
 if(t.dataset.filedeliver!==undefined)readImage(t.files[0],url=>{TMP.deliver=url;const pv=$('#pv-deliver');if(pv)pv.innerHTML=`<img alt="Pré-visualização" src="${url}">`;});
 if(t.dataset.filedispute!==undefined)readImage(t.files[0],url=>{TMP.dispute=url;const pv=$('#pv-dispute');if(pv)pv.innerHTML=`<img alt="Pré-visualização" src="${url}">`;});
 if(t.dataset.filenewprod!==undefined)readImage(t.files[0],url=>{TMP.newprod=url;const pv=$('#pv-newprod');if(pv)pv.innerHTML=`<img alt="Pré-visualização" src="${url}">`;});
 if(t.dataset.fileavatar!==undefined)readImage(t.files[0],async url=>{try{await api('/farms/me/mine',{method:'PUT',body:JSON.stringify({avatarUrl:url})});toast('Foto de perfil atualizada.');renderMain();}catch(x){toast(x.message);}});
 if(t.dataset.filefarmphoto!==undefined)readImage(t.files[0],async url=>{try{await api('/farms/me/photos',{method:'POST',body:JSON.stringify({url})});toast('Foto adicionada.');renderMain();}catch(x){toast(x.message);}});
});

/* ---------- start ---------- */
boot();
})();
</script>
</body>
</html>
