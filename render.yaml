databases:
  - name: epyalink-db
    plan: free
    databaseName: epyalink
    user: epyalink

services:
  - type: web
    name: epyalink
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: epyalink-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: KAMBASMS_API_KEY
        sync: false
      - key: KAMBASMS_BASE_URL
        value: https://api.kambasms.ao
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE
        value: otp_code
